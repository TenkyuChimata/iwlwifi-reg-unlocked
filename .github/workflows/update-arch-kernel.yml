name: Update Arch Linux kernel package

on:
  schedule:
    # 每小时第 43 分钟检查，避开整点高峰
    - cron: "43 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arch-kernel
  cancel-in-progress: false

jobs:
  update:
    name: Check, build and publish
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    # GitHub Actions 在 container 中默认使用 sh；
    # 本工作流使用 Bash 数组、[[ ]] 和 pipefail，因此强制使用 bash。
    defaults:
      run:
        shell: bash

    env:
      AUR_PACKAGE_NAME: linux-wireless-reg-unlocked
      AUR_GIT_NAME: TenkyuChimata
      AUR_GIT_EMAIL: tenkyuchimata@users.noreply.github.com
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PACKAGE_BUILD_DIR: /tmp/linux-wireless-reg-unlocked-build

    steps:
      # archlinux:base-devel 默认不保证包含 Git。
      # 必须先安装 Git，再运行 actions/checkout；否则 checkout 可能无法
      # 创建正常的 Git 工作树，后续也无法使用 git 命令。
      - name: Install checkout and update tools
        run: |
          set -Eeuo pipefail

          pacman -Syu --noconfirm --needed \
            ca-certificates \
            curl \
            git \
            jq \
            openssh \
            pacman-contrib \
            rsync

          git --version

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

          # 即使手动运行时选择了其他 ref，也始终更新默认分支。
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify checkout
        run: |
          set -Eeuo pipefail

          readonly repo_dir="${GITHUB_WORKSPACE}"

          git config --global --add safe.directory "${repo_dir}"

          if [[ ! -d "${repo_dir}/.git" ]]; then
            echo "::error::actions/checkout did not create .git metadata"
            echo "Workspace contents:"
            ls -la "${repo_dir}" || true
            exit 1
          fi

          echo "Git version:"
          git --version

          echo "Repository root:"
          git -C "${repo_dir}" rev-parse --show-toplevel

          echo "Checked-out commit:"
          git -C "${repo_dir}" rev-parse HEAD

          echo "Working-tree status:"
          git -C "${repo_dir}" status --short

      - name: Check latest Arch kernel
        id: update
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"
          chmod +x scripts/update-arch-kernel.sh
          scripts/update-arch-kernel.sh

      - name: Install kernel build dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          pacman -S --noconfirm --needed \
            bc \
            kmod \
            linux \
            linux-headers \
            namcap \
            patch

          installed_kernel="$(pacman -Q linux | awk '{print $2}')"
          expected_kernel="${{ steps.update.outputs.kernelpkgver }}"

          echo "Installed kernel package: ${installed_kernel}"
          echo "Expected kernel package:  ${expected_kernel}"

          if [[ "${installed_kernel}" != "${expected_kernel}" ]]; then
            echo "::error::Arch mirror is not synchronized with archlinux.org"
            exit 1
          fi

      - name: Create unprivileged build user
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          if ! id builder >/dev/null 2>&1; then
            useradd --create-home builder
          fi

          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Update checksums
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          runuser -u builder -- \
            env \
              HOME=/home/builder \
              GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash -c '
              set -Eeuo pipefail
              cd "${GITHUB_WORKSPACE}"
              updpkgsums
            '

      - name: Regenerate .SRCINFO
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          runuser -u builder -- \
            env \
              HOME=/home/builder \
              GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash -c '
              set -Eeuo pipefail
              cd "${GITHUB_WORKSPACE}"
              makepkg --printsrcinfo > .SRCINFO
            '

      - name: Prepare isolated package build directory
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          readonly repo_dir="${GITHUB_WORKSPACE}"
          readonly build_dir="${PACKAGE_BUILD_DIR}"

          rm -rf "${build_dir}"
          install -d -m 755 -o builder -g builder "${build_dir}"

          # makepkg 不在 GitHub 工作树中运行，避免 --clean/--cleanbuild
          # 或其他构建清理操作影响仓库的 .git 元数据。
          rsync \
            --archive \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='src/' \
            --exclude='pkg/' \
            --exclude='*.pkg.tar.*' \
            "${repo_dir}/" \
            "${build_dir}/"

          chown -R builder:builder "${build_dir}"

          echo "Repository directory: ${repo_dir}"
          echo "Package build directory: ${build_dir}"

          if ! git -C "${repo_dir}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::Git repository metadata disappeared before package build"
            ls -la "${repo_dir}" || true
            exit 1
          fi

      - name: Build package
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          runuser -u builder -- \
            env \
              HOME=/home/builder \
              PACKAGE_BUILD_DIR="${PACKAGE_BUILD_DIR}" \
            bash -c '
              set -Eeuo pipefail
              cd "${PACKAGE_BUILD_DIR}"

              makepkg \
                --cleanbuild \
                --clean \
                --noconfirm
            '

      - name: Run packaging checks
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          readonly repo_dir="${GITHUB_WORKSPACE}"
          readonly build_dir="${PACKAGE_BUILD_DIR}"

          # 工作区已交给 builder，因此 root 使用 Git 时显式加入安全目录。
          git config --global --add safe.directory "${repo_dir}"

          if ! git -C "${repo_dir}" \
            rev-parse --is-inside-work-tree \
            >/dev/null 2>&1; then
            echo "::error::Git repository not found at ${repo_dir}"
            echo "Current directory: $(pwd)"
            echo "Repository contents:"
            ls -la "${repo_dir}" || true
            exit 1
          fi

          # 仅检查本次自动更新会提交的打包元数据。
          git -C "${repo_dir}" diff --check -- PKGBUILD .SRCINFO

          # namcap 的部分警告不一定适用于外部内核模块，
          # 因此暂时仅报告，不阻止发布。
          namcap "${repo_dir}/PKGBUILD" || true

          package_file="$(
            find "${build_dir}" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.*' \
              ! -name '*.sig' \
              -print \
              -quit
          )"

          if [[ -z "${package_file}" ]]; then
            echo "::error::makepkg completed without producing a package"
            echo "Build directory contents:"
            ls -la "${build_dir}" || true
            exit 1
          fi

          echo "Built package: ${package_file}"
          namcap "${package_file}" || true

      - name: Commit and push GitHub update
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          readonly repo_dir="${GITHUB_WORKSPACE}"

          git config --global --add safe.directory "${repo_dir}"

          if ! git -C "${repo_dir}" \
            rev-parse --is-inside-work-tree \
            >/dev/null 2>&1; then
            echo "::error::Git repository not found before commit"
            ls -la "${repo_dir}" || true
            exit 1
          fi

          git -C "${repo_dir}" config \
            user.name "github-actions[bot]"

          git -C "${repo_dir}" config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "${repo_dir}" add PKGBUILD .SRCINFO

          if git -C "${repo_dir}" diff --cached --quiet; then
            echo "No GitHub changes to commit."
          else
            echo "Changes to commit:"
            git -C "${repo_dir}" diff --cached --stat

            git -C "${repo_dir}" commit \
              -m "Update to linux ${{ steps.update.outputs.kernelpkgver }}"

            git -C "${repo_dir}" push \
              origin \
              "HEAD:${GITHUB_DEFAULT_BRANCH}"
          fi

      # 这两个 AUR 步骤故意不加 changed 条件：
      # 如果上一次运行已经推送 GitHub、但同步 AUR 时临时失败，
      # 下一次定时运行仍会自动重新同步并恢复一致性。
      - name: Configure AUR SSH authentication
        id: aur_ssh
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          readonly ssh_dir="/tmp/aur-ssh"
          readonly expected_fingerprint="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::GitHub secret AUR_SSH_PRIVATE_KEY is empty or missing"
            exit 1
          fi

          rm -rf "${ssh_dir}"
          install -d -m 700 "${ssh_dir}"

          # 删除复制私钥时可能混入的 Windows CR 字符。
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" \
            | tr -d '\r' \
            > "${ssh_dir}/id_ed25519"

          chmod 600 "${ssh_dir}/id_ed25519"

          # 验证私钥本身能够被 OpenSSH 读取。
          if ! ssh-keygen \
            -y \
            -f "${ssh_dir}/id_ed25519" \
            >/dev/null; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not a valid OpenSSH private key"
            exit 1
          fi

          # 获取 AUR 当前的 Ed25519 主机密钥。
          ssh-keyscan \
            -T 20 \
            -t ed25519 \
            aur.archlinux.org \
            2>/dev/null \
            > "${ssh_dir}/known_hosts"

          if [[ ! -s "${ssh_dir}/known_hosts" ]]; then
            echo "::error::ssh-keyscan did not return an AUR host key"
            exit 1
          fi

          chmod 600 "${ssh_dir}/known_hosts"

          actual_fingerprints="$(
            ssh-keygen \
              -lf "${ssh_dir}/known_hosts" \
              -E sha256 \
              | awk '{print $2}'
          )"

          echo "Expected AUR fingerprint:"
          echo "  ${expected_fingerprint}"
          echo "Received SSH fingerprints:"
          while IFS= read -r fingerprint; do
            echo "  ${fingerprint}"
          done <<< "${actual_fingerprints}"

          if ! grep \
            -Fqx \
            "${expected_fingerprint}" \
            <<< "${actual_fingerprints}"; then
            echo "::error::AUR SSH host-key fingerprint mismatch"
            exit 1
          fi

          cat > "${ssh_dir}/config" <<EOF
          Host aur.archlinux.org
              HostName aur.archlinux.org
              User aur
              IdentityFile ${ssh_dir}/id_ed25519
              IdentitiesOnly yes
              UserKnownHostsFile ${ssh_dir}/known_hosts
              StrictHostKeyChecking yes
              BatchMode yes
              LogLevel ERROR
          EOF

          chmod 600 "${ssh_dir}/config"

          # 供下一个步骤使用；不在环境变量中写入私钥本身。
          echo "AUR_SSH_DIR=${ssh_dir}" >> "${GITHUB_ENV}"

          # 在 clone 之前验证主机密钥和 AUR 账户授权。
          # AUR 维护时 SSH 会返回非零状态，因此必须先捕获输出，
          # 只把明确的维护提示视为本次运行可安全跳过。
          set +e
          ssh_output="$(
            ssh \
              -T \
              -F "${ssh_dir}/config" \
              aur.archlinux.org \
              help \
              2>&1
          )"
          ssh_status=$?
          set -e

          printf '%s\n' "${ssh_output}"

          if grep \
            -Fq \
            "The AUR is down due to maintenance. We will be back soon." \
            <<< "${ssh_output}"; then
            echo "::warning::AUR is under maintenance; skipping AUR synchronization for this run"
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if (( ssh_status != 0 )); then
            echo "::error::AUR SSH authentication check failed with exit code ${ssh_status}"
            exit "${ssh_status}"
          fi

          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Synchronize and verify AUR repository
        if: steps.aur_ssh.outputs.available == 'true'
        run: |
          set -Eeuo pipefail

          if [[ -z "${AUR_SSH_DIR:-}" ]]; then
            echo "::error::AUR SSH configuration was not initialized"
            exit 1
          fi

          export GIT_SSH_COMMAND="ssh -F ${AUR_SSH_DIR}/config"

          readonly aur_dir="/tmp/aur-package"
          readonly staging_dir="/tmp/aur-package-staging"
          readonly aur_rpc_url="https://aur.archlinux.org/rpc/v5/info"

          aur_rpc_version() {
            local response

            if ! response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 5 \
                --retry-delay 3 \
                --retry-all-errors \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --get \
                --data-urlencode "arg[]=${AUR_PACKAGE_NAME}" \
                "${aur_rpc_url}"
            )"; then
              echo "::warning::Could not query AUR RPC" >&2
              printf '%s\n' "<unavailable>"
              return 0
            fi

            jq -r \
              'if (.resultcount // 0) > 0
               then .results[0].Version
               else "<missing>"
               end' \
              <<< "${response}"
          }

          srcinfo_value() {
            local key="$1"

            sed -nE \
              "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*(.+)$/\1/p" \
              .SRCINFO \
              | head -n 1
          }

          rm -rf "${aur_dir}" "${staging_dir}"

          # AUR 与 GitHub 必须保持各自独立的 Git 历史。
          # 始终先 clone AUR 当前 master，再在它上面创建 fast-forward commit。
          git clone \
            "ssh://aur@aur.archlinux.org/${AUR_PACKAGE_NAME}.git" \
            "${aur_dir}"

          install -d -m 755 "${staging_dir}"

          # AUR 仓库禁止包含子目录，因此只同步这些顶层打包文件。
          package_files=(
            PKGBUILD
            .SRCINFO
            0001-iwlwifi-add-lar_disable.patch
            0002-iwlwifi-nvm-unlock-6ghz-and-relax-channel-flags.patch
            0003-cfg80211-allow-unsigned-regdb-and-reject-driver-country-ie-regdom-hints.patch
            iwlwifi-lar.conf
            dracut-wireless-reg-unlocked.conf
            linux-wireless-reg-unlocked.install
          )

          for file in "${package_files[@]}"; do
            source_path="${GITHUB_WORKSPACE}/${file}"

            if [[ ! -f "${source_path}" ]]; then
              echo "::error::Required AUR package file is missing: ${file}"
              exit 1
            fi

            install \
              -m 644 \
              "${source_path}" \
              "${staging_dir}/${file}"
          done

          if [[ -f "${GITHUB_WORKSPACE}/LICENSE" ]]; then
            install \
              -m 644 \
              "${GITHUB_WORKSPACE}/LICENSE" \
              "${staging_dir}/LICENSE"
          fi

          # 正常同步时保持 GitHub 生成的 .SRCINFO 原样。
          # 只有在 AUR Git 已一致、但 aurweb 元数据仍过期时，
          # 才在后面的恢复分支制造一次无语义的 blob 变化。

          # 让 AUR 工作树精确匹配上面的顶层文件，同时保留 .git。
          rsync \
            --archive \
            --checksum \
            --delete \
            --itemize-changes \
            --exclude='.git/' \
            "${staging_dir}/" \
            "${aur_dir}/"

          cd "${aur_dir}"

          git config user.name "${AUR_GIT_NAME}"
          git config user.email "${AUR_GIT_EMAIL}"

          pkgver="$(srcinfo_value pkgver)"
          pkgrel="$(srcinfo_value pkgrel)"
          epoch="$(srcinfo_value epoch || true)"

          if [[ -z "${pkgver}" || -z "${pkgrel}" ]]; then
            echo "::error::Could not read pkgver/pkgrel from .SRCINFO"
            exit 1
          fi

          expected_aur_version="${pkgver}-${pkgrel}"

          if [[ -n "${epoch}" ]]; then
            expected_aur_version="${epoch}:${expected_aur_version}"
          fi

          current_aur_version="$(aur_rpc_version)"

          echo "Expected AUR version: ${expected_aur_version}"
          echo "Current AUR RPC version: ${current_aur_version}"

          git add --all

          if git diff --cached --quiet; then
            if [[ "${current_aur_version}" == "${expected_aur_version}" ]]; then
              echo "AUR Git repository and aurweb metadata are already synchronized."
              exit 0
            fi

            # 极端恢复路径：文件已经一致，但 aurweb 仍停留在旧版本。
            # 再增加一个空行，确保本次 push 的 .SRCINFO blob 必然变化。
            echo "::warning::AUR Git is synchronized, but aurweb metadata is stale"
            printf '\n' >> .SRCINFO
            git add .SRCINFO
            commit_message="Refresh metadata for ${expected_aur_version}"
          else
            commit_message="Update to ${expected_aur_version}"
          fi

          echo "Files to publish to AUR:"
          git status --short

          git commit -m "${commit_message}"
          git push origin master

          # 以 AUR Git 远端 HEAD 为发布成功的权威判断。
          # aurweb/RPC 元数据可能在 Git push 后延迟更新，因此不能用短暂的
          # RPC 旧值反向否定已经成功的 Git 发布。
          local_head="$(git rev-parse HEAD)"
          remote_head="$(
            git ls-remote origin refs/heads/master \
              | awk 'NR == 1 { print $1 }'
          )"

          if [[ -z "${remote_head}" ]]; then
            echo "::error::Could not read AUR Git remote HEAD"
            exit 1
          fi

          echo "Local AUR commit:  ${local_head}"
          echo "Remote AUR commit: ${remote_head}"

          if [[ "${local_head}" != "${remote_head}" ]]; then
            echo "::error::AUR Git remote HEAD does not match the pushed commit"
            exit 1
          fi

          echo "AUR Git repository successfully updated."

          # 尽量等待 aurweb/RPC 同步，并要求中间缓存重新验证响应。
          # 即使最终仍未刷新，也只给出 warning；下一次定时运行
          # 会再次检查并在确有必要时触发元数据恢复。
          for attempt in $(seq 1 60); do
            published_aur_version="$(aur_rpc_version)"

            printf \
              'AUR metadata verification %d/60: %s\n' \
              "${attempt}" \
              "${published_aur_version}"

            if [[ "${published_aur_version}" == "${expected_aur_version}" ]]; then
              echo "AUR Git and aurweb metadata successfully updated."
              exit 0
            fi

            sleep 5
          done

          echo \
            "::warning::AUR Git was updated successfully, but aurweb RPC still reports " \
            "${published_aur_version}; expected ${expected_aur_version}"

          echo \
            "::warning::This is likely delayed aurweb metadata propagation. " \
            "Published AUR commit: ${remote_head}"

          exit 0
